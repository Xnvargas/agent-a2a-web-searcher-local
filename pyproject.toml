[project]
name = "agentstack-agents"
version = "0.1.1"
description = "A Starter template for granite-4 agents using agentstack and langgraph"
readme = "README.md"
authors = [{ name = "IBM Corp." }, { name = "Xavier Vargas" }]
requires-python = ">=3.11,<4.0"
dependencies = [
    "a2a-sdk>=0.3.9",
    "agentstack-sdk>=0.4.0",
    "langchain[openai]>=0.3.27",
    "langchain-community>=0.3.0",
    "langgraph>=0.6.10",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[project.scripts]
server = "agentstack_agents.agent:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "watchfiles>=1.1.0",
]
